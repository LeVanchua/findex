[project]
name = "findex"
version = "1.0.0"
description = "Streaming and vectorized ranked search, asyncio crawler and FastAPI web search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "pydantic-settings>=2.6", "numpy>=1.26"]

[project.scripts]
findex = "findex.app:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pyright>=1.1",
    "ruff>=0.9",
    "matplotlib>=3.11.2",
    "pytest-benchmark>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests taking over one second"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/findex"]
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
