[project]
name = "findex"
version = "0.4.0"
description = "Streaming Ukrainian text corpus statistics (Python lab 01)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
findex = "findex.app:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "pyright>=1.1", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests taking over one second"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/findex"]
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
