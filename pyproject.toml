[project]
name = "findex"
version = "0.1.0"
description = "Streaming Ukrainian text corpus statistics (Python lab 01)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
findex = "findex.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
